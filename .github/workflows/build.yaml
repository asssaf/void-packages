name: Check build
run-name: Check build ref:${{ github.ref_name }} templates:"${{ inputs.templates }}" publish:${{ inputs.publish }} skip_build:${{ inputs.skip_build }}

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  push:
    branches:
      - 'ci-**'
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      templates:
        description: Templates to build, space separated
        type: string
        required: true
      publish:
        description: Publish a package
        type: boolean
        default: false
      skip_build:
        description: Skip build if a package already exists in the repo
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint changed templates.
  xlint:
    name: Lint templates
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-musl-full
      env:
        LICENSE_LIST: common/travis/license.lst

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash grep curl git
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Prepare masterdir
        run: |
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          common/travis/fetch-xtools.sh

      - name: Find changed templates
        run: sudo -Eu builder common/travis/changed_templates.sh

      - name: Run lints
        run: |
          sudo -Eu builder common/travis/verify-update-check.sh || rv=1
          sudo -Eu builder common/travis/xlint.sh || rv=1
          exit "${rv:-0}"

  # Build changed packages.
  build:
    name: Build packages
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.body, '[ci skip]')"
    outputs:
      x86_64-musl_templates: ${{ steps.output-templates.outputs.x86_64-musl_templates }}
      armv6l-musl_templates: ${{ steps.output-templates.outputs.armv6l-musl_templates }}
      aarch64-musl_templates: ${{ steps.output-templates.outputs.aarch64-musl_templates }}

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full
      options: --platform ${{ matrix.config.platform }} --privileged --tmpfs /__e/node24/bin:rw,exec
      volumes:
        - /dev:/dev
      env:
        ARCH: '${{ matrix.config.arch }}'
        BOOTSTRAP: '${{ matrix.config.host }}'
        TEST: '${{ matrix.config.test }}'

    strategy:
      fail-fast: false
      matrix:
        config:
          #- { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          #- { arch: i686,         host: i686,        libc: glibc, platform: linux/386,   test: 1 }
          #- { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          #- { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1, repo: "https://repo-default.voidlinux.org/current/musl" }
          - { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0, repo: "https://repo-default.voidlinux.org/current/musl" }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0, repo: "https://repo-default.voidlinux.org/current/aarch64" }

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Prepare masterdir
        run: |
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Find changed templates
        shell: bash
        run: |
          set -exo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_build }}" = "true" ]
            then
              XBPS_ARCH=${{ matrix.config.arch }} xbps-install -Sy -i --repository "${{ matrix.config.repo }}"

              touch /tmp/templates
              for PKG in ${{ inputs.templates }}
              do
                if XBPS_ARCH=${{ matrix.config.arch }} xbps-query --repository "${{ matrix.config.repo }}" "$PKG"
                then
                  echo "$PKG will be downloaded"
                  echo "$PKG" >> /tmp/download
                else
                  echo "$PKG will be built"
                  echo "$PKG" >> /tmp/build
                fi
              done
            fi
            if [ -e "/tmp/build" ]
            then
              sudo -Eu builder ./xbps-src sort-dependencies $(cat /tmp/build) | tee /tmp/templates
            fi
          else
            sudo -Eu builder common/travis/changed_templates.sh
          fi

      - name: Build and check packages
        run: sudo -Eu builder common/travis/build.sh "$BOOTSTRAP" "$ARCH" "$TEST"

      - name: Show files
        run: sudo -Eu builder common/travis/show_files.sh "$BOOTSTRAP" "$ARCH"

      - name: Compare to previous
        run: sudo -Eu builder common/travis/xpkgdiff.sh "$BOOTSTRAP" "$ARCH"

      - name: Check file conflicts
        if: matrix.config.arch == 'x86_64' # the arch indexed in xlocate
        run: |
          if [ -s /tmp/templates ]; then
              export XDG_CACHE_HOME="$PWD/.cache"
              sudo -Eu builder xlocate -S &&
              sudo -Eu builder common/scripts/lint-conflicts
          fi

      - name: Verify repository state
        run: |
          mkdir -p /check-install &&
          chown builder:builder /check-install &&
          sudo -Eu builder common/travis/check-install.sh "$BOOTSTRAP" "$ARCH"

      - name: Convert packages
        shell: bash
        run: |
          set -exo pipefail
          xbps-install -Sy squashfs-tools zstd

          touch /tmp/build
          cp /tmp/build /tmp/templates
          if [ -e "/tmp/download" ]
          then
            mkdir -p /target/var/db/xbps
            ln -s /var/db/xbps/keys /target/var/db/xbps/
            XBPS_TARGET_ARCH=${{ matrix.config.arch }} xbps-install -Sy -R ${{ matrix.config.repo }} -r /target -D $(cat /tmp/download)
            cp -s /target/var/cache/xbps/* hostdir/binpkgs/
            cat /tmp/download >> /tmp/templates
          fi

          common/travis/convert-pkg.sh "$ARCH"

      - name: Fix nodejs installation for actions
        run: |
          xbps-install -y nodejs
          mkdir -p /__e/node24/bin
          ln -sf /usr/bin/node /__e/node24/bin/node

      - name: Upload packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binpkgs-${{ matrix.config.arch }}
          path: "hostdir/binpkgs"

      - name: Output templates
        id: output-templates
        run: |
          echo "${{ matrix.config.arch }}_templates<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/converted >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


  publish:
    needs: build
    if: "contains(github.event.pull_request.title, '[ci-publish]') || contains(github.event.pull_request.body, '[ci-publish]') || inputs.publish"
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        config:
          - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          - { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }

    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/asssaf/void-packages-${{ matrix.template }}:${{ matrix.config.arch }}-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        # v4.4.0, verified via git ls-remote
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        id: download_step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binpkgs-${{ matrix.config.arch }}
          path: ./
        continue-on-error: true

      - name: Publish image
        if: steps.download_step.outcome == 'success'
        shell: bash
        run: |
          set -exo pipefail

          echo "${{ needs.build.outputs[format('{0}_templates', matrix.config.arch)] }}" | while IFS= read -r TEMPLATE
          do
            IMAGE="ghcr.io/asssaf/void-packages-${TEMPLATE}:${{ matrix.config.arch }}-latest"
            tar c ${template}*.xbps ${TEMPLATE}.* | docker import - "${IMAGE}"
            docker push "${IMAGE}"
          done
